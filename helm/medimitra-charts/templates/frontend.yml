apiVersion: apps/v1
kind: Deployment
metadata:
  name: medimitra-frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: {{ .Values.frontendimage }}:{{ .Values.frontendtag }}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
