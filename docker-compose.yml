version: "3.9"

services:
  frontend:
    container_name: medimitra/frontend
    build:
      context: .
      dockerfile: ./client/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - agent
  backend:
    container_name: medimitra/backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "5000:5001"
    env_file:
      - backend/.env

  agent:
    container_name: medimitra/agent
    build:
      context: .
      dockerfile: ./agent/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - agent/.env