version: "3.9"

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - agent
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5001"
    env_file:
      - backend/.env

  agent:
    container_name: agent
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - agent/.env