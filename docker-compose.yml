version: "3.9"

services:
  frontend:
    image: mrinal672/medimitra-frontend
    container_name: frontend
    build:
      context: .
      dockerfile: ./client/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - agent
  backend:
    image: mrinal672/medimitra-backend
    container_name: backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "5000:5001"
    env_file:
      - backend/.env

  agent:
    image: mrinal672/medimitra-agent
    container_name: agent
    build:
      context: .
      dockerfile: ./agent/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - agent/.env