version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5001"
    depends_on:
      - agent
    env_file:
      - Backend/.env

  agent:
    container_name: agent
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - agent/.env